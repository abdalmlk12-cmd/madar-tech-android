
name: Build MADAR TECH APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q MADAR_TECH_Android_Improved_Source.zip -d .

      - name: Build APK
        run: gradle -p MADAR_TECH_Android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MADAR-TECH-APK
          path: MADAR_TECH_Android/app/build/outputs/apk/debug/app-debug.apk
